name: Auto Comment
on:
  pull_request:
    paths:
      - tests/*
jobs:
  auto-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Changes
        id: pr-changes
        run: echo "::set-output name=changes::${{ toJson(github.event.pull_request.changed_files) }}"

      - name: Create Comment
        if: steps.pr-changes.outputs.changes != '[]'
        run: |
          # Use GitHub API to create a comment on the PR
          PR_NUMBER=${{ github.event.pull_request.number }}
          HASH=${{ github.ref }}
          COMMENT="@${{ github.event.pull_request.user.login }}, your pull request contains changes to test files."
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          COMMENT_URL="https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}/comments"

          for FILE in ${{ github.event.pull_request.changed_files }}; do
              curl -s -H "Authorization: token ${GITHUB_TOKEN}" -X POST $COMMENT_URL -d "{\"body\":\"$COMMENT\", \"commit_id\":\"$HASH\", \"path\":\"$FILE\"}"
          done
